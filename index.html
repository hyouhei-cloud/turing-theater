<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>上映テスト</title>
<style>
  :root { --bg:#0b0b0d; --curtain:#5a0d12; --gold:#d8b25a; --text:#f3efe6; --muted:#9c968a; --ok:#5fd38a; --ng:#ff6b6b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Hiragino Sans",sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    padding:16px; background:radial-gradient(ellipse at 50% 0%, #2a0a0d 0%, var(--bg) 70%); }
  .marquee { color:var(--gold); letter-spacing:.3em; font-size:14px; }
  .screen { width:100%; max-width:720px; aspect-ratio:16/9; background:#000; border:3px solid #222;
    box-shadow:0 0 60px rgba(216,178,90,.15); position:relative; }
  .screen > * { position:absolute; inset:0; width:100%; height:100%; border:0; }
  video { object-fit:contain; background:#000; }
  #start { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px;
    background:rgba(0,0,0,.45); color:var(--text); font-size:26px; font-weight:800; letter-spacing:.1em; border:0; cursor:pointer; z-index:5; }
  #start .tri { width:76px; height:76px; border-radius:50%; background:var(--gold); color:#1a1206; display:flex; align-items:center; justify-content:center; font-size:34px; padding-left:6px; box-shadow:0 0 30px rgba(216,178,90,.5); }
  #start.hidden { display:none; }
  /* 本番（#app・#tap）では検証用の表示を隠す */
  .show #status, .show #log, .show #beat { display:none; }
  #soon { position:absolute; inset:0; background:#000; display:flex; align-items:center; justify-content:center; color:var(--gold);
    font-size:24px; font-weight:800; letter-spacing:.2em; }
  #status { font-size:22px; font-weight:700; text-align:center; min-height:1.4em; }
  #status.ok { color:var(--ok); } #status.ng { color:var(--ng); }
  #log { width:100%; max-width:720px; font:12px/1.5 ui-monospace,Menlo,monospace; color:var(--muted);
    max-height:28vh; overflow:auto; white-space:pre-wrap; }
</style>
</head>
<body>
  <div class="marquee">★ TURING THEATER ★</div>
  <div class="screen" id="screen"></div>
  <input id="catcher" autofocus autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="none" aria-label="キー受け" style="position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0.01;font-size:16px;border:0;padding:0">
  <div id="status">キーを1つ送ってください（スペース・Enter・Mなど）</div>
  <div id="beat" style="font-size:12px;color:#9c968a"></div>
  <div id="log"></div>

<script>
// 上映テスト（MOVIEモジュールの検証用 2026-11-02）
// 使い方：
//   …/            → YouTube（初期の動画）を消音で流し、キーを受け取ったら消音を解く
//   …/#動画ID      → その YouTube 動画で同じことをする
//   …/#mp4        → このページに置いた自前のテスト動画（ピッ音）で同じことをする
const DEFAULT_YT = "OOUUq14b4W0";
const hash = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
// 本番用（MOVIEモジュールが開く形。2026-11-02）：
//   #app動画ID → YouTubeアプリで開くようiPhoneに頼む（確認は、演者の合図でアプリがEnterで通す）
//   #tap動画ID → このページで、観客に「▶ 上映開始」をタップしてもらう
//   #key動画ID → 演者の合図（アプリが送る再読み込み⌘R）が届いてから、YouTubeアプリで開くよう頼む
//                （2026-11-03：#appで「開きますか？」を出したまま長く待つと、Enterが効かなくなったため。
//                  合図の時に「開きますか？」を出し、出た直後のEnterで通す）
//   動画IDは、打ち込みで化けないよう16進数（22文字の0-9a-f）で届くので元に戻す
//   （2026-11-03：大文字や「_」を打つとIDが崩れ「この動画は再生できません」になったため）
//   以前の形（そのままのID、「_」を「.」にしたID）も受け付ける
const lowerHash = hash.toLowerCase();
const show = lowerHash.startsWith("app") ? "app" : lowerHash.startsWith("tap") ? "tap" : lowerHash.startsWith("key") ? "key" : null;
const rawId = show ? hash.slice(3) : hash;
function decodeId(s) {
  if (/^[0-9a-f]{22}$/i.test(s)) return s.match(/../g).map(h => String.fromCharCode(parseInt(h, 16))).join("");
  return s.replace(/\./g, "_");
}
const decodedId = decodeId(rawId);
const isApp = show === "app";
const isKey = show === "key";
const tapMode = show === "tap";
if (show) document.documentElement.classList.add("show");
if (isApp) {
  const id = decodedId || DEFAULT_YT;
  setTimeout(() => { location.href = "youtube://www.youtube.com/watch?v=" + id; }, 600);
}
// 以前は、7秒たってもYouTubeアプリに移らなければ #tap に切り替えていた。
// 2026-11-03：アプリは「"YouTube"で開きますか？」を出したまま演者の合図（Enter）を待つ形に変えたため、切り替えはやめた
// （待っている間に切り替わると、確認が消えてしまう）。YouTubeアプリが無い相手には、アプリ側で #tap を選ぶ
const mode = isApp ? "app" : isKey ? "key" : lowerHash === "mp4" ? "mp4" : "yt";
const ytId = mode === "yt" ? (decodedId || DEFAULT_YT) : null;

const screen = document.getElementById("screen");
// 観客に押してもらう「上映開始」ボタン（2026-11-02：キーではフォーカス次第で届かないため、確実な方法として追加）
const startBtn = document.createElement("button");
startBtn.id = "start"; startBtn.innerHTML = '<span class="tri">▶</span><span>上映開始</span>';
startBtn.addEventListener("click", () => unlock("上映開始ボタン"));

const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
let unlocked = false;
let player = null, ytReady = false, video = null;

function log(msg) {
  const t = new Date().toLocaleTimeString("ja-JP");
  logEl.textContent = `${t}  ${msg}\n` + logEl.textContent;
}
function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ""; }

log(`モード: ${mode === "key" ? "合図でYouTubeアプリへ渡す" : mode === "app" ? "YouTubeアプリへ渡す" : mode === "mp4" ? "自前の動画(mp4)" : "YouTube " + ytId}`);

// ---------- 自前の動画 ----------
if (mode === "mp4") {
  video = document.createElement("video");
  video.src = "test.mp4";
  video.muted = true; video.autoplay = true; video.loop = true;
  video.playsInline = true; video.setAttribute("playsinline", "");
  screen.appendChild(video);
  video.addEventListener("play", () => { if (video.dataset.started) onMediaToggled("動画", true); video.dataset.started = 1; });
  video.addEventListener("pause", () => onMediaToggled("動画", false));
  video.play().then(() => log("消音で自動再生できました"))
              .catch(e => log("自動再生できず: " + e.name));
}

// ---------- YouTube ----------
if (mode === "yt") {
  const div = document.createElement("div"); div.id = "yt"; screen.appendChild(div);
  const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
}
// ---------- #key：合図を待ってからYouTubeアプリへ ----------
// 合図はアプリが送る「再読み込み（⌘R）」。読み込み直されたページは、すぐにYouTubeアプリで開くよう頼む
// （ページを開いた直後なら、ページからアプリを開く確認が出せる。出た直後に、アプリがEnterで「開く」を押す）。
// 2026-11-03 実機：メディアキーは消音の動画に届かず、キーもフォーカス次第で届かないため、再読み込みを合図にした
const loadedAt = Date.now();
let lastLaunch = 0;
function launchApp(source) {
  if (!isKey) return;
  const now = Date.now();
  if (now - lastLaunch < 1500) return;
  lastLaunch = now;
  log(`合図: ${source} → YouTubeアプリで開く`);
  location.href = "youtube://www.youtube.com/watch?v=" + (decodedId || DEFAULT_YT);
}
if (isKey) {
  const nav = (performance.getEntriesByType && performance.getEntriesByType("navigation")[0]) || null;
  const reloaded = nav ? nav.type === "reload" : (performance.navigation && performance.navigation.type === 1);
  if (reloaded) setTimeout(() => launchApp("再読み込み"), 300);
}
if (mode !== "app" && mode !== "key") screen.appendChild(startBtn);
else { const soon = document.createElement("div"); soon.id = "soon"; soon.textContent = "まもなく上映"; screen.appendChild(soon); }
window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player("yt", {
    videoId: ytId,
    playerVars: { autoplay: 1, mute: 1, playsinline: 1, controls: 0, rel: 0, modestbranding: 1 },
    events: {
      onReady: () => { ytReady = true; log("YouTubeの準備ができました"); player.mute(); player.playVideo(); },
      onStateChange: e => {
        // #tap：観客がタップするまでは、最初の場面で止めておく（消音で流れ始めたらすぐ止めて頭に戻す）
        if (tapMode && e.data === 1 && !unlocked && !tapHeld) { tapHeld = true; player.pauseVideo(); player.seekTo(0, true); }
        else if (e.data === 1 && ytLastState === 2 && !tapMode) onMediaToggled("YouTube", true);
        ytLastState = e.data; log("YouTubeの状態: " + ({"-1":"未開始","0":"終了","1":"再生中","2":"一時停止","3":"読み込み中","5":"頭出し"}[e.data] ?? e.data)); },
      onError: e => log("YouTubeのエラー: " + e.data)
    }
  });
};

// ---------- キーを受け取ったら消音を解く ----------
function unlock(source) {
  log(`受け取り: ${source}`);
  if (mode === "mp4" && video) {
    video.muted = false; video.volume = 1;
    video.play().then(() => {
      unlocked = true;
      setTimeout(() => {
        const ok = !video.muted && !video.paused;
        if (ok) startBtn.classList.add("hidden");
        setStatus(ok ? "🔊 音ありで再生中（成功）" : "🔇 まだ消音（失敗）", ok ? "ok" : "ng");
        log(`結果: muted=${video.muted} paused=${video.paused}`);
      }, 600);
    }).catch(e => { setStatus("🔇 音ありで再生できません: " + e.name, "ng"); log("失敗: " + e.name); });
  }
  if (mode === "yt") {
    if (!ytReady) { setStatus("YouTubeの準備中です。もう一度キーを送ってください", "ng"); return; }
    player.unMute(); player.setVolume(100); player.playVideo();
    setTimeout(() => {
      const muted = player.isMuted();
      const playing = player.getPlayerState() === 1;
      setStatus(!muted && playing ? "🔊 音ありで再生中（成功）" : `🔇 まだ消音か停止中（失敗）`, !muted && playing ? "ok" : "ng");
      log(`結果: 消音=${muted} 状態=${player.getPlayerState()}`);
      unlocked = !muted && playing;
      if (unlocked) startBtn.classList.add("hidden");
    }, 1000);
  }
}

// 診断用：ページにどんな合図が届いたかを全部記録する（2026-11-02 実機でキーが無反応だったため）
["keyup","keypress","focus","blur","visibilitychange","pageshow","pointerdown"].forEach(t =>
  window.addEventListener(t, e => log(`届いた合図: ${t}${e.key ? "「" + e.key + "」" : ""}${t === "visibilitychange" ? " " + document.visibilityState : ""}`), true));
// フォーカスをページに引き寄せる試み（2026-11-02 実機で「ページ外」になることがあったため）
document.body.tabIndex = -1;
let lastFocus = null;
const catcher = document.getElementById("catcher");
// 打ち込まれた文字は消す（入力欄に文字がたまらないように）
catcher.addEventListener("input", () => { catcher.value = ""; });
function pullFocus(why) {
  // 2026-11-02 実機で body への focus では「ページ外」のままだったため、入力欄にフォーカスを当てる
  try { window.focus(); if (document.activeElement !== catcher) catcher.focus({ preventScroll: true }); } catch (e) {}
  const f = document.hasFocus();
  if (f !== lastFocus) { log(`フォーカス: ${f ? "ページ" : "ページ外"}（${why}）`); lastFocus = f; }
}
pullFocus("読み込み直後");
let pulls = 0;
const pullTimer = setInterval(() => { pullFocus("自動"); if (++pulls > 20) clearInterval(pullTimer); }, 500);
setInterval(() => { document.getElementById("beat").textContent = `ページ動作中 ${new Date().toLocaleTimeString("ja-JP")}　フォーカス=${document.hasFocus() ? "ページ" : "ページ外"}・入力欄=${document.activeElement === catcher ? "○" : "×"}`;   pullFocus("監視");
}, 1000);
document.addEventListener("keydown", e => {
  if (e.key === " " || e.key === "Tab") e.preventDefault();
  if ((e.key === "Enter" || e.key === " ") && Date.now() - loadedAt > 1500) launchApp(`キー「${e.key === " " ? "スペース" : e.key}」`);
  unlock(`キー「${e.key === " " ? "スペース" : e.key}」`);
});
// 末尾（#mp4 など）だけ変えて開き直したときは、読み込み直して切り替える
window.addEventListener("hashchange", () => location.reload());
// 「再生／一時停止」のメディアキーで消音を解く試み（2026-11-02：キーはフォーカス次第で届かないが、
// メディアキーはフォーカスに関係なく、いま流れている動画に届いていたため）
if ("mediaSession" in navigator) {
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: "TURING THEATER", artist: "上映テスト" });
    ["play", "pause", "stop", "nexttrack", "previoustrack"].forEach(a => {
      try { navigator.mediaSession.setActionHandler(a, () => unlock(`メディアキー「${a}」`)); } catch (e) { log(`メディアキー ${a} は登録できません`); }
    });
    log("メディアキーの受け口を登録しました");
  } catch (e) { log("メディアキー登録の失敗: " + e.name); }
} else { log("このSafariはメディアキーの受け口に未対応"); }
// 動画そのものが止まった／動いた時も記録し、動いた瞬間に消音を解いてみる
let ytLastState = null;
let tapHeld = false;
function onMediaToggled(src, playing) {
  log(`${src}: ${playing ? "再生" : "一時停止"}になりました`);
  if (playing && !unlocked) unlock(src + "の再生");
}
// 指で画面を触った場合も同じ（比較用）
document.addEventListener("touchend", () => unlock("画面タッチ"), { passive: true });
</script>
</body>
</html>
