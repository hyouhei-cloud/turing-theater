<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>上映テスト</title>
<style>
  :root { --bg:#0b0b0d; --curtain:#5a0d12; --gold:#d8b25a; --text:#f3efe6; --muted:#9c968a; --ok:#5fd38a; --ng:#ff6b6b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Hiragino Sans",sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    padding:16px; background:radial-gradient(ellipse at 50% 0%, #2a0a0d 0%, var(--bg) 70%); }
  .marquee { color:var(--gold); letter-spacing:.3em; font-size:14px; }
  .screen { width:100%; max-width:720px; aspect-ratio:16/9; background:#000; border:3px solid #222;
    box-shadow:0 0 60px rgba(216,178,90,.15); position:relative; }
  .screen > * { position:absolute; inset:0; width:100%; height:100%; border:0; }
  video { object-fit:contain; background:#000; }
  #start { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px;
    background:rgba(0,0,0,.45); color:var(--text); font-size:26px; font-weight:800; letter-spacing:.1em; border:0; cursor:pointer; z-index:5; }
  #start .tri { width:76px; height:76px; border-radius:50%; background:var(--gold); color:#1a1206; display:flex; align-items:center; justify-content:center; font-size:34px; padding-left:6px; box-shadow:0 0 30px rgba(216,178,90,.5); }
  #start.hidden { display:none; }
  /* 本番（#app・#tap）では検証用の表示を隠す */
  .show #status, .show #log, .show #beat { display:none; }
  #soon { position:absolute; inset:0; background:#000; display:flex; align-items:center; justify-content:center; color:var(--gold);
    font-size:24px; font-weight:800; letter-spacing:.2em; }
  /* 調べもの用：届いた文字と読み取った番号（2026-11-04） */
  #diag { position:fixed; left:8px; right:8px; bottom:8px; z-index:20; font:11px/1.5 ui-monospace,Menlo,monospace;
    color:#888; white-space:pre-wrap; word-break:break-all; }
  #status { font-size:22px; font-weight:700; text-align:center; min-height:1.4em; }
  #status.ok { color:var(--ok); } #status.ng { color:var(--ng); }
  #log { width:100%; max-width:720px; font:12px/1.5 ui-monospace,Menlo,monospace; color:var(--muted);
    max-height:28vh; overflow:auto; white-space:pre-wrap; }
</style>
</head>
<body>
  <div class="marquee">★ TURING THEATER ★</div>
  <div class="screen" id="screen"></div>
  <input id="catcher" autofocus autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="none" aria-label="キー受け" style="position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0.01;font-size:16px;border:0;padding:0">
  <div id="status">キーを1つ送ってください（スペース・Enter・Mなど）</div>
  <div id="beat" style="font-size:12px;color:#9c968a"></div>
  <div id="log"></div>

<script>
// 上映テスト（MOVIEモジュールの検証用 2026-11-02）
// 使い方：
//   …/            → YouTube（初期の動画）を消音で流し、キーを受け取ったら消音を解く
//   …/#動画ID      → その YouTube 動画で同じことをする
//   …/#mp4        → このページに置いた自前のテスト動画（ピッ音）で同じことをする
const DEFAULT_YT = "OOUUq14b4W0";
const hash = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
// 本番用（MOVIEモジュールが開く形。2026-11-02）：
//   #app動画ID → YouTubeアプリで開くようiPhoneに頼む（確認は、演者の合図でアプリがEnterで通す）
//   #tap動画ID → このページで、観客に「▶ 上映開始」をタップしてもらう
//   #key動画ID → 演者の合図（アプリが送る再読み込み⌘R）が届いてから、YouTubeアプリで開くよう頼む
//                （2026-11-03：#appで「開きますか？」を出したまま長く待つと、Enterが効かなくなったため。
//                  合図の時に「開きますか？」を出し、出た直後のEnterで通す）
//   動画IDは、打ち込みで化けないよう16進数（22文字の0-9a-f）で届くので元に戻す
//   （2026-11-03：大文字や「_」を打つとIDが崩れ「この動画は再生できません」になったため）
//   以前の形（そのままのID、「_」を「.」にしたID）も受け付ける
const lowerHash = hash.toLowerCase();
const show = lowerHash.startsWith("app") ? "app" : lowerHash.startsWith("tap") ? "tap" : lowerHash.startsWith("key") ? "key" : null;
const rawId = show ? hash.slice(3) : hash;
// 2026-11-03：小文字と数字（a-z・2-7）の14文字を「0」をはさんで2回送る形を追加。打ち込みで1文字抜けても、
// 14文字そろっている方を使う
const B32 = "abcdefghijklmnopqrstuvwxyz234567";
const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
function fromB32(p) {
  let bits = "";
  for (const ch of p) bits += B32.indexOf(ch).toString(2).padStart(5, "0");
  let id = "";
  for (let i = 0; i < 11; i++) id += B64[parseInt(bits.slice(i * 6, i * 6 + 6), 2)];
  return id;
}
// 2026-11-09：「i5」が「ĭ」（記号つきの文字）になって届き、形の確認ではじかれて正しい方の14文字まで
// 使えなかった。記号を外し、a-z・0-9 以外の文字を取り除いてから読む（抜けた分はもう片方で直す）
function cleanB32(s) { return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
function decodeId(raw) {
  const s = cleanB32(raw);
  if (/^[a-z2-7]*(0[a-z2-7]*)+$/.test(s)) {
    const good = s.split("0").find(p => p.length === 14);
    if (good) return fromB32(good);
    console.warn("動画の番号が崩れて届きました: " + s);
  }
  if (/^[0-9a-f]{22}$/i.test(raw)) return raw.match(/../g).map(h => String.fromCharCode(parseInt(h, 16))).join("");
  return raw.replace(/\./g, "_");
}
let decodedId = decodeId(rawId);
// 2026-11-06：2回とも崩れて届くと、崩れた文字をそのまま番号として使い「再生できません」になっていた。
// 2回分を見比べて正しい形を組み立て直した候補を作り、YouTubeに本当にある動画の番号を選ぶ。
// 14文字の最後の1文字は、余りのビットが0なので「a」か「q」にしかならない（形の確認に使う）
function looksRight(p) { return p.length === 14 && /^[a-z2-7]{13}[aq]$/.test(p); }
function repairCandidates(raw) {
  const s = cleanB32(raw);
  if (!/^[a-z2-7]*(0[a-z2-7]*)+$/.test(s)) return [];
  const parts = s.split("0").filter(p => p.length >= 12 && p.length <= 16);
  const out = [];
  const add = p => { if (looksRight(p) && !out.includes(p)) out.push(p); };
  parts.forEach(add);                                   // そのまま正しい形のもの
  for (const a of parts) for (const b of parts) {
    if (a === b) continue;
    if (a.length === 13) for (let k = 0; k <= 13; k++) if (b[k]) add(a.slice(0, k) + b[k] + a.slice(k));   // 1文字抜け：もう片方の同じ位置の文字で埋める
    if (a.length === 15) for (let k = 0; k < 15; k++) { const c = a.slice(0, k) + a.slice(k + 1); if (c === b) add(c); }  // 1文字多い：もう片方と一致する形
  }
  for (const a of parts) {
    if (a.length === 15) for (let k = 0; k < 15; k++) add(a.slice(0, k) + a.slice(k + 1));            // 1文字多い：1文字ずつ外す
  }
  return out.slice(0, 40);
}
function thumbExists(id) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => res(img.naturalWidth > 120);
    img.onerror = () => res(false);
    img.src = "https://i.ytimg.com/vi/" + encodeURIComponent(id) + "/mqdefault.jpg";
    setTimeout(() => res(false), 6000);
  });
}
let verifyState = "確認中…";
// 合図は「再読み込み」なので、合図の時にページが読み直される。確かめた番号は読み直しても残しておき、
// 合図の後にもう一度確かめ直さなくて済むようにする
const verifiedKey = "turingVerified:" + rawId;
try {
  const cached = sessionStorage.getItem(verifiedKey);
  if (cached) { decodedId = cached; verifyState = "○ 確認済み（合図の前に確かめた番号）"; }
} catch (e) {}
let verifyPromise = null;
async function verifyId() {
  if (!(await thumbExists(decodedId)) ) {
    const cands = repairCandidates(rawId).map(fromB32).filter(id => id !== decodedId);
    const results = await Promise.all(cands.map(async id => [id, await thumbExists(id)]));
    const hit = results.find(r => r[1]);
    if (hit) { verifyState = "○ 崩れていた番号を直して使う（" + decodedId + " → " + hit[0] + "）"; decodedId = hit[0]; }
    else verifyState = "× YouTubeに無い番号（直せませんでした・候補" + cands.length + "個）";
  } else verifyState = "○ ある";
  if (verifyState.startsWith("○")) { try { sessionStorage.setItem(verifiedKey, decodedId); } catch (e) {} }
  if (typeof drawDiag === "function") drawDiag();
}
const isApp = show === "app";
const isKey = show === "key";
const tapMode = show === "tap";
if (show) document.documentElement.classList.add("show");
if (isApp) {
  const id = decodedId || DEFAULT_YT;
  setTimeout(() => { location.href = "youtube://www.youtube.com/watch?v=" + id; }, 600);
}
// 以前は、7秒たってもYouTubeアプリに移らなければ #tap に切り替えていた。
// 2026-11-03：アプリは「"YouTube"で開きますか？」を出したまま演者の合図（Enter）を待つ形に変えたため、切り替えはやめた
// （待っている間に切り替わると、確認が消えてしまう）。YouTubeアプリが無い相手には、アプリ側で #tap を選ぶ
const mode = isApp ? "app" : isKey ? "key" : lowerHash === "mp4" ? "mp4" : "yt";
const ytId = mode === "yt" ? (decodedId || DEFAULT_YT) : null;

const screen = document.getElementById("screen");
// 観客に押してもらう「上映開始」ボタン（2026-11-02：キーではフォーカス次第で届かないため、確実な方法として追加）
const startBtn = document.createElement("button");
startBtn.id = "start"; startBtn.innerHTML = '<span class="tri">▶</span><span>上映開始</span>';
startBtn.addEventListener("click", () => unlock("上映開始ボタン"));

const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
let unlocked = false;
let player = null, ytReady = false, video = null;

function log(msg) {
  const t = new Date().toLocaleTimeString("ja-JP");
  logEl.textContent = `${t}  ${msg}\n` + logEl.textContent;
}
function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ""; }

log(`モード: ${mode === "key" ? "合図でYouTubeアプリへ渡す" : mode === "app" ? "YouTubeアプリへ渡す" : mode === "mp4" ? "自前の動画(mp4)" : "YouTube " + ytId}`);

// ---------- 自前の動画 ----------
if (mode === "mp4") {
  video = document.createElement("video");
  video.src = "test.mp4";
  video.muted = true; video.autoplay = true; video.loop = true;
  video.playsInline = true; video.setAttribute("playsinline", "");
  screen.appendChild(video);
  video.addEventListener("play", () => { if (video.dataset.started) onMediaToggled("動画", true); video.dataset.started = 1; });
  video.addEventListener("pause", () => onMediaToggled("動画", false));
  video.play().then(() => log("消音で自動再生できました"))
              .catch(e => log("自動再生できず: " + e.name));
}

// ---------- YouTube ----------
if (mode === "yt") {
  const div = document.createElement("div"); div.id = "yt"; screen.appendChild(div);
  const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
}
// ---------- #key：合図を待ってからYouTubeアプリへ ----------
// 合図はアプリが送る「再読み込み（⌘R）」。読み込み直されたページは、すぐにYouTubeアプリで開くよう頼む
// （ページを開いた直後なら、ページからアプリを開く確認が出せる。出た直後に、アプリがEnterで「開く」を押す）。
// 2026-11-03 実機：メディアキーは消音の動画に届かず、キーもフォーカス次第で届かないため、再読み込みを合図にした
const loadedAt = Date.now();
let lastLaunch = 0;
// 2026-11-09（試し）：合図の後は「"YouTube"で開きますか？」を出さず、YouTube のふつうのアドレスで開く
// （iPhone は youtube.com のアドレスを YouTube アプリで開く＝ユニバーサルリンク）。確認から移る場面でキーボードが
// 隠れていたため。Enter で「開く」を押す必要もなくなる。アプリで開かず Safari の中で開いた時は、この試しは失敗
let launchByWebLink = false;
function launchApp(source) {
  if (!isKey) return;
  const now = Date.now();
  if (now - lastLaunch < 1500) return;
  lastLaunch = now;
  log(`合図: ${source} → YouTubeアプリで開く`);
  try { localStorage.setItem("turingLastLaunch", `${new Date().toLocaleTimeString("ja-JP")} ${decodedId}（${verifyState}）`); } catch (e) {}
  const vid = decodedId || DEFAULT_YT;
  location.href = launchByWebLink ? "https://www.youtube.com/watch?v=" + vid : "youtube://www.youtube.com/watch?v=" + vid;
}
// 2026-11-04：前の上映ページを表示したまま次のURLを打つと「#」の後ろだけ変わり、ページが自分で読み込み直す。
// これも「再読み込み」と記録されるため、準備の時点で確認が出てしまっていた → 自分で読み直した時は合図にしない
let selfReload = false;
try { selfReload = sessionStorage.getItem("turingSelfReload") === "1"; sessionStorage.removeItem("turingSelfReload"); } catch (e) {}
// 合図の後の、キーボードを戻してから YouTube へ渡す流れ（再読み込みで始める。2026-11-09：再読み込みが届かず
// 「合図待ち」のまま Tab が来た時も、この流れを始める。その時は Tab の知らせの中で欄を選ぶ）
function startKbMode(how, tabEvent) {
  if (kbMode) return;
  cueState = how + " → キーボードを戻してからYouTubeへ";
  // 2026-11-09：合図の⌘Rで相手の画面キーボードが隠れ、その後に入力欄が選ばれる瞬間が無いので戻らなかった。
  // 見えない入力欄を選んでおき、アプリが送る Tab（念のため）→ キーボードを戻す信号（Eject）で出してから、
  // 欄を外してYouTubeへ渡す。キーボードが出たのは画面の高さの変化で知る。出なくても、少し待てば渡す
  const kb = document.createElement("input");
  kb.id = "kb"; kb.type = "text"; kb.autocomplete = "off"; kb.setAttribute("autocorrect", "off");
  kb.setAttribute("autocapitalize", "off"); kb.spellcheck = false; kb.setAttribute("aria-hidden", "true");
  kb.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0;margin:0;";
  // 2026-11-09 試し2：ページの命令で youtube.com へ移っても Safari の中で開いた（人の操作でないため、アプリに渡らない）。
  // 欄をフォームに入れ、アプリが送る Enter（人の操作と同じ扱い）で youtube.com へ送り出す → YouTube アプリで開くはず。
  // 確認の画面が出ないので欄は選ばれたままになり、Enter の直後の Eject でキーボードを出し直せる
  const form = document.createElement("form");
  form.action = "https://www.youtube.com/watch"; form.method = "get";
  form.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;overflow:hidden;";
  const vField = document.createElement("input"); vField.type = "hidden"; vField.name = "v";
  form.appendChild(kb); form.appendChild(vField);
  let submitted = false;
  form.addEventListener("submit", () => {
    submitted = true;
    vField.value = decodedId || DEFAULT_YT;
    note("Enterで youtube.com へ（" + vField.value + "）");
    try { localStorage.setItem("turingLastLaunch", `${new Date().toLocaleTimeString("ja-JP")} ${vField.value}（${verifyState}・Enterで送り出し）`); } catch (e) {}
  });
  document.body.appendChild(form);
  kbMode = true;
  const oldCatcher = document.getElementById("catcher");
  if (oldCatcher) { oldCatcher.blur(); oldCatcher.remove(); }
  let kbState = "欄を選ぶ";
  // 調べもの用：届いたキー・欄の選ばれ方・画面の高さを、読み込みからの秒数つきで残す
  const t0 = performance.now();
  const kbLog = [];
  const note = m => { kbLog.push(((performance.now() - t0) / 1000).toFixed(1) + "s " + m); cueState = how + " → " + kbState + "\nキーボードの記録: " + kbLog.join(" / "); if (typeof drawDiag === "function") drawDiag(); };
  const setKb = t => { kbState = t; note(t); };
  kb.addEventListener("focus", () => note("欄が選ばれた"));
  kb.addEventListener("blur", () => note("欄が外れた"));
  const focusKb = () => { try { kb.focus({ preventScroll: true }); } catch (e) { kb.focus(); } };
  // 2026-11-09 実機：読み込んですぐページから欄を選ぶと、選ばれた扱い（activeElement）にはなるが「選ばれた」知らせは来ず、
  // Tab・Eject を送ってもキーボードは出なかった（iPhone は、人の操作なしにページが選んだ欄を本当の入力先にしない）。
  // → ページからは選ばず、アプリが送る Tab で iPhone 自身に欄へ移らせる。移らなかった時だけ、キーの知らせの中で選ぶ
  setKb("Tab待ち");
  document.addEventListener("keydown", e => {
    note("キー " + (e.key || e.keyCode));
    if (e.key === "Tab" && !launched) {
      setTimeout(() => {
        if (document.activeElement === kb) note("Tabで欄へ移った");
        else { note("Tabで移らず（" + (document.activeElement ? document.activeElement.tagName : "なし") + "）→ ページで選ぶ"); focusKb(); }
      }, 60);
    }
  }, true);
  const vv = window.visualViewport;
  const baseH = vv ? vv.height : window.innerHeight;
  let launched = false;
  const go = async why => {
    if (launched) return; launched = true;
    setKb(why);
  };
  note("画面の高さ " + Math.round(baseH));
  if (vv) vv.addEventListener("resize", () => { note("高さ " + Math.round(vv.height)); if (vv.height < baseH * 0.85) go("キーボードが出た → Enter待ち"); });
  // 2026-11-09 実機：2秒ではキーボードが出ないまま渡した（Eject が届く前に時間切れだった疑い）。3.5秒にのばす
  setTimeout(() => go("キーボードが出ないまま → Enter待ち"), 3500);
  // Enter も届かなかった時の最後の保険：これまでどおり「開きますか？」を出す
  // 2026-11-09 実機：YouTube で再生でき、メモ帳でもキーボードは出ていたのに、Safari に戻った時に消えた。
  // 裏にいる間は時計が止まり、戻った瞬間にこの7秒の保険が動いて「開きますか？」を出していた疑い（確認の画面はキーボードを隠す）。
  // → Enter で送り出した後や、一度でも裏へ回った後は、保険を出さない
  let wentAway = false;
  document.addEventListener("visibilitychange", () => { note("画面 " + document.visibilityState); if (document.visibilityState === "hidden") wentAway = true; });
  window.addEventListener("pageshow", e => note("ページ表示" + (e.persisted ? "（保存から）" : "")));
  setTimeout(() => {
    if (submitted || wentAway) { note("保険は出さない（" + (submitted ? "送り出し済み" : "裏へ回った") + "）"); return; }
    if (document.visibilityState === "visible") { note("Enterが来ない → 開きますか？を出す"); launchApp("保険"); }
  }, 7000);
  if (tabEvent) { tabEvent.preventDefault(); focusKb(); note("Tabで始めた（再読み込みは届かず）"); }
}
let cueState = "合図待ち";
// 2026-11-09：合図の後にキーボードを戻す間は、昔の「キー受け」欄（catcher：キーボードを出さない設定で、
// 1秒ごとに選び直し、Tab も止める）を止める。3回目の実機で、Tab がこの欄へ行き、0.2秒後に選択も奪われていた
let kbMode = false;
if (isKey) {
  const nav = (performance.getEntriesByType && performance.getEntriesByType("navigation")[0]) || null;
  const reloaded = nav ? nav.type === "reload" : (performance.navigation && performance.navigation.type === 1);
  if (reloaded && !selfReload) {
    startKbMode("再読み込み＝合図");
  }
  else if (selfReload) cueState = "URLの打ち直しで読み直し（合図ではない）→ 合図待ち";
  if (!kbMode) document.addEventListener("keydown", e => {
    if (e.key === "Tab" && !kbMode && Date.now() - loadedAt > 1500) startKbMode("Tabが合図（再読み込みは届かず）", e);
  }, true);
}
if (mode !== "app" && mode !== "key") screen.appendChild(startBtn);
else { const soon = document.createElement("div"); soon.id = "soon"; soon.textContent = "まもなく上映"; screen.appendChild(soon); }
// 調べもの用（2026-11-04）：失敗した時にSafariへ戻ってスクショしてもらい、届いた文字の崩れ方を見る
if (show) {
  const diag = document.createElement("div"); diag.id = "diag"; document.body.appendChild(diag);
  const parts = rawId.split("0");
  const form = /^[a-z2-7]*(0[a-z2-7]*)+$/.test(rawId)
    ? (parts.length === 2 && parts[0] === parts[1] && parts[0].length === 14 ? "2回送り・2回とも正しい形"
       : parts.some(p => p.length === 14) ? "2回送り・片方が崩れている（" + parts.map(p => p.length).join("+") + "文字）"
       : "2回送り・両方崩れている（" + parts.map(p => p.length).join("+") + "文字）")
    : /^[0-9a-f]{22}$/i.test(rawId) ? "16進数の形" : "その他の形";
  let lastLaunch = "なし";
  try { lastLaunch = localStorage.getItem("turingLastLaunch") || "なし"; } catch (e) {}
  const loadedTime = new Date().toLocaleTimeString("ja-JP");
  window.drawDiag = () => { diag.textContent =
    `届いた文字: ${rawId}（${rawId.length}文字）\n形: ${form}\n使う番号: ${decodedId}\nYouTubeにある動画か: ${verifyState}\n合図: ${cueState}\n読み込み: ${loadedTime}\n前回YouTubeへ渡した番号: ${lastLaunch}`; };
  drawDiag();
}
// YouTubeのサムネイル（中サイズ）は、無い動画だと小さな代わりの絵になる（幅120）。合図を待つ間に確かめて、必要なら直す
if (show && decodedId && verifyState === "確認中…") verifyPromise = verifyId();
window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player("yt", {
    videoId: ytId,
    playerVars: { autoplay: 1, mute: 1, playsinline: 1, controls: 0, rel: 0, modestbranding: 1 },
    events: {
      onReady: () => { ytReady = true; log("YouTubeの準備ができました"); player.mute(); player.playVideo(); },
      onStateChange: e => {
        // #tap：観客がタップするまでは、最初の場面で止めておく（消音で流れ始めたらすぐ止めて頭に戻す）
        if (tapMode && e.data === 1 && !unlocked && !tapHeld) { tapHeld = true; player.pauseVideo(); player.seekTo(0, true); }
        else if (e.data === 1 && ytLastState === 2 && !tapMode) onMediaToggled("YouTube", true);
        ytLastState = e.data; log("YouTubeの状態: " + ({"-1":"未開始","0":"終了","1":"再生中","2":"一時停止","3":"読み込み中","5":"頭出し"}[e.data] ?? e.data)); },
      onError: e => log("YouTubeのエラー: " + e.data)
    }
  });
};

// ---------- キーを受け取ったら消音を解く ----------
function unlock(source) {
  log(`受け取り: ${source}`);
  if (mode === "mp4" && video) {
    video.muted = false; video.volume = 1;
    video.play().then(() => {
      unlocked = true;
      setTimeout(() => {
        const ok = !video.muted && !video.paused;
        if (ok) startBtn.classList.add("hidden");
        setStatus(ok ? "🔊 音ありで再生中（成功）" : "🔇 まだ消音（失敗）", ok ? "ok" : "ng");
        log(`結果: muted=${video.muted} paused=${video.paused}`);
      }, 600);
    }).catch(e => { setStatus("🔇 音ありで再生できません: " + e.name, "ng"); log("失敗: " + e.name); });
  }
  if (mode === "yt") {
    if (!ytReady) { setStatus("YouTubeの準備中です。もう一度キーを送ってください", "ng"); return; }
    player.unMute(); player.setVolume(100); player.playVideo();
    setTimeout(() => {
      const muted = player.isMuted();
      const playing = player.getPlayerState() === 1;
      setStatus(!muted && playing ? "🔊 音ありで再生中（成功）" : `🔇 まだ消音か停止中（失敗）`, !muted && playing ? "ok" : "ng");
      log(`結果: 消音=${muted} 状態=${player.getPlayerState()}`);
      unlocked = !muted && playing;
      if (unlocked) startBtn.classList.add("hidden");
    }, 1000);
  }
}

// 診断用：ページにどんな合図が届いたかを全部記録する（2026-11-02 実機でキーが無反応だったため）
["keyup","keypress","focus","blur","visibilitychange","pageshow","pointerdown"].forEach(t =>
  window.addEventListener(t, e => log(`届いた合図: ${t}${e.key ? "「" + e.key + "」" : ""}${t === "visibilitychange" ? " " + document.visibilityState : ""}`), true));
// フォーカスをページに引き寄せる試み（2026-11-02 実機で「ページ外」になることがあったため）
document.body.tabIndex = -1;
let lastFocus = null;
const catcher = document.getElementById("catcher");
// 打ち込まれた文字は消す（入力欄に文字がたまらないように）
catcher.addEventListener("input", () => { catcher.value = ""; });
function pullFocus(why) {
  // 2026-11-02 実機で body への focus では「ページ外」のままだったため、入力欄にフォーカスを当てる
  if (kbMode) return;
  try { window.focus(); if (document.activeElement !== catcher) catcher.focus({ preventScroll: true }); } catch (e) {}
  const f = document.hasFocus();
  if (f !== lastFocus) { log(`フォーカス: ${f ? "ページ" : "ページ外"}（${why}）`); lastFocus = f; }
}
pullFocus("読み込み直後");
let pulls = 0;
const pullTimer = setInterval(() => { pullFocus("自動"); if (++pulls > 20) clearInterval(pullTimer); }, 500);
setInterval(() => { document.getElementById("beat").textContent = `ページ動作中 ${new Date().toLocaleTimeString("ja-JP")}　フォーカス=${document.hasFocus() ? "ページ" : "ページ外"}・入力欄=${document.activeElement === catcher ? "○" : "×"}`;   pullFocus("監視");
}, 1000);
document.addEventListener("keydown", e => {
  if (e.key === " " || (e.key === "Tab" && !kbMode)) e.preventDefault();
  if (kbMode && document.activeElement && document.activeElement.id === "kb") return;   // 欄の Enter はフォームが送り出す
  if ((e.key === "Enter" || e.key === " ") && Date.now() - loadedAt > 1500) launchApp(`キー「${e.key === " " ? "スペース" : e.key}」`);
  unlock(`キー「${e.key === " " ? "スペース" : e.key}」`);
});
// 末尾（#mp4 など）だけ変えて開き直したときは、読み込み直して切り替える
window.addEventListener("hashchange", () => {
  try { sessionStorage.setItem("turingSelfReload", "1"); } catch (e) {}
  location.reload();
});
// 「再生／一時停止」のメディアキーで消音を解く試み（2026-11-02：キーはフォーカス次第で届かないが、
// メディアキーはフォーカスに関係なく、いま流れている動画に届いていたため）
if ("mediaSession" in navigator) {
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: "TURING THEATER", artist: "上映テスト" });
    ["play", "pause", "stop", "nexttrack", "previoustrack"].forEach(a => {
      try { navigator.mediaSession.setActionHandler(a, () => unlock(`メディアキー「${a}」`)); } catch (e) { log(`メディアキー ${a} は登録できません`); }
    });
    log("メディアキーの受け口を登録しました");
  } catch (e) { log("メディアキー登録の失敗: " + e.name); }
} else { log("このSafariはメディアキーの受け口に未対応"); }
// 動画そのものが止まった／動いた時も記録し、動いた瞬間に消音を解いてみる
let ytLastState = null;
let tapHeld = false;
function onMediaToggled(src, playing) {
  log(`${src}: ${playing ? "再生" : "一時停止"}になりました`);
  if (playing && !unlocked) unlock(src + "の再生");
}
// 指で画面を触った場合も同じ（比較用）
document.addEventListener("touchend", () => unlock("画面タッチ"), { passive: true });
</script>
</body>
</html>
